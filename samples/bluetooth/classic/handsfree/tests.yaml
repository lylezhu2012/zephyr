sample:
  name: Bluetooth Handsfree
tests:
  sample.bluetooth.handsfree:
    harness: bluetooth
    platform_allow:
      - qemu_cortex_m3
      - qemu_x86
    tags: bluetooth
    integration_platforms:
      - qemu_cortex_m3
  sample.bluetooth.handsfree.voice_over_pcm.no_blobs:
    harness: bluetooth
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
    tags: bluetooth
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
    build_only: true
  sample.bluetooth.handsfree.voice_over_hci.no_blobs:
    harness: bluetooth
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
    tags: bluetooth
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
      - CONFIG_BT_VOICE_OVER_HCI=y
    build_only: true
