CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_LOG=y
CONFIG_ZTEST=y

CONFIG_BT_DEVICE_NAME="test_hfp"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF

CONFIG_BT_RFCOMM=y
CONFIG_BT_HFP_HF=y
CONFIG_BT_HFP_AG=y

# Feature set of the board-to-board HFP tests
CONFIG_BT_HFP_HF_CLI=y
CONFIG_BT_HFP_HF_VOLUME=y
CONFIG_BT_HFP_HF_CODEC_NEG=y
CONFIG_BT_HFP_HF_CODEC_MSBC=y
CONFIG_BT_HFP_HF_CODEC_LC3_SWB=y
CONFIG_BT_HFP_HF_ECNR=y
CONFIG_BT_HFP_HF_3WAY_CALL=y
CONFIG_BT_HFP_HF_ECS=y
CONFIG_BT_HFP_HF_VOICE_RECG_TEXT=y
CONFIG_BT_HFP_HF_HF_INDICATOR_ENH_SAFETY=y
CONFIG_BT_HFP_HF_HF_INDICATOR_BATTERY=y

CONFIG_BT_HFP_AG_CODEC_NEG=y
CONFIG_BT_HFP_AG_CODEC_MSBC=y
CONFIG_BT_HFP_AG_CODEC_LC3_SWB=y
CONFIG_BT_HFP_AG_ECNR=y
CONFIG_BT_HFP_AG_3WAY_CALL=y
CONFIG_BT_HFP_AG_ECS=y
CONFIG_BT_HFP_AG_VOICE_RECG_TEXT=y
CONFIG_BT_HFP_AG_VOICE_TAG=y
CONFIG_BT_HFP_AG_HF_INDICATOR_ENH_SAFETY=y
CONFIG_BT_HFP_AG_HF_INDICATOR_BATTERY=y
CONFIG_BT_HFP_AG_OUTGOING_TIMEOUT=10
CONFIG_BT_HFP_AG_INCOMING_TIMEOUT=10

# call::test_031_rah_query_then_hold needs the +BTRH sent when the AG holds the incoming call to
# be the first result code after the AT+BTRH? query. The AG holds the call less than 1 second
# after the HF has received RING and +CLIP, so they must not be repeated earlier. This is the
# default value, set explicitly for the test.
CONFIG_BT_HFP_AG_RING_NOTIFY_INTERVAL=3

# The AG queues several unsolicited result codes back to back from the test thread while the HF
# may still send AT commands. With too few buffers, the AG reply to an AT command, allocated in
# the Bluetooth RX work queue, can wait for a buffer that is only released by the AG TX work
# running in the same work queue.
CONFIG_BT_HFP_AG_TX_BUF_COUNT=20

CONFIG_TEST_CLASSIC_HFP_SIM_LOG_LEVEL_DBG=y
