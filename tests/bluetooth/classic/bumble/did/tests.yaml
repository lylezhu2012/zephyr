common:
  tags:
    - bluetooth
  platform_allow:
    - native_sim
  harness: ztest
  sidecar: bumble
tests:
  bluetooth.classic.sim.did.sdp:
    timeout: 300
    sidecar_config:
      bumble:
        addresses:
          - 00:00:01:00:00:01
          - 00:00:01:00:00:02
        devices:
          - --peer_bd_address=00:00:01:00:00:02 -test=did_client_sdp::*
          - --peer_bd_address=00:00:01:00:00:01 -test=did_server_sdp::*
  bluetooth.classic.sim.did.disabled:
    timeout: 120
    extra_configs:
      - CONFIG_BT_DID=n
    sidecar_config:
      bumble:
        addresses:
          - 00:00:01:00:00:01
          - 00:00:01:00:00:02
        devices:
          - --peer_bd_address=00:00:01:00:00:02 -test=did_client_disabled::*
          - --peer_bd_address=00:00:01:00:00:01 -test=did_server_disabled::*
