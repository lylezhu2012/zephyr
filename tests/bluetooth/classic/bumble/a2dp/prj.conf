CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_LOG=y
CONFIG_ZTEST=y

CONFIG_BT_DEVICE_NAME="test_a2dp"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF

# Both devices register a sink and a source endpoint; each test chooses the endpoints it uses.
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SINK=y
CONFIG_BT_A2DP_SOURCE=y

CONFIG_TEST_CLASSIC_A2DP_SIM_LOG_LEVEL_DBG=y
