CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_TESTING=y
CONFIG_LOG=y
CONFIG_ZTEST=y

CONFIG_BT_DEVICE_NAME="test_avrcp"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF

# Both devices register the controller and the target role, as in the board-to-board tests.
CONFIG_BT_AVRCP=y
CONFIG_BT_AVRCP_CONTROLLER=y
CONFIG_BT_AVRCP_TARGET=y
CONFIG_BT_AVRCP_BROWSING=y

# The tests keep copies of the received events (up to 640 bytes each) on the stack.
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_TEST_CLASSIC_AVRCP_SIM_LOG_LEVEL_DBG=y
