CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_RFCOMM=y
CONFIG_LOG=y
CONFIG_ZTEST=y

CONFIG_BT_DEVICE_NAME="test_rfcomm"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF

# More ACL RX buffers allow the RFCOMM stack to grant more than one RX credit per DLC.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8

CONFIG_TEST_CLASSIC_RFCOMM_SIM_LOG_LEVEL_DBG=y
